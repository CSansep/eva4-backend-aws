# ==============================================================================
# Nginx Configuration for EVA4 Backend on AWS EC2 (Ubuntu)
# ==============================================================================
# Optimized for DevSecOps, OWASP Top 10 compliance, and API Gateway integration.
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Security: Hide Nginx server version in HTTP response headers (DAST protection)
    server_tokens off;

    # Maximum payload size for file attachments (Amazon S3 uploads)
    client_max_body_size 50M;

    # Security Headers for OWASP ZAP compliance
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Local Static Files (used when USE_S3=False or as local fallback)
    location /static/ {
        alias /home/ubuntu/apps/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Local Media Files (used when USE_S3=False or as local fallback)
    location /media/ {
        alias /home/ubuntu/apps/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all HTTP requests to Gunicorn Unix Socket
    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/apps/backend/backend.sock;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for backend processing
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # Fast health check location
    location /api/v1/health/ {
        proxy_pass http://unix:/home/ubuntu/apps/backend/backend.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }
}
