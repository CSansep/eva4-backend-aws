# ==============================================================================
# SonarQube Scanner Configuration for EVA4 Django DRF Backend
# ==============================================================================
sonar.projectKey=eva4-backend-service
sonar.projectName=EVA4 Backend Enterprise API
sonar.projectVersion=1.0.0

# Source and Test code directories
sonar.sources=backend_project,core
sonar.tests=core/tests

# Language and Python runtime targets
sonar.language=py
sonar.python.version=3.11,3.12

# File encoding
sonar.sourceEncoding=UTF-8

# Code Coverage & Test Reports
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions for SAST scanning
# Excludes virtual environments, migrations, static assets, templates, and deployment scripts
sonar.exclusions=venv/**,.venv/**,**/migrations/**,static/**,staticfiles/**,media/**,deploy/**,manage.py,**/__pycache__/**

# Coverage Exclusions
sonar.coverage.exclusions=**/tests/**,**/migrations/**,manage.py,backend_project/asgi.py,backend_project/wsgi.py,core/admin.py
